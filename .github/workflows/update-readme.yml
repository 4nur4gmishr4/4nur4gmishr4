name: Update Profile README

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate.js'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Assets and README
        run: |
          npm ci
          node scripts/generate.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --local user.email "anuragmishrasnag06082004@gmail.com"
          git config --local user.name "Anurag Mishra"
          git add README.md assets/
          git commit -m "chore: dynamically update profile UI assets" || exit 0
          git push
